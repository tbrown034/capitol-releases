name: Daily pipeline

on:
  schedule:
    # Once a day, weekdays, 21:00 UTC (5pm ET / 4pm EST after Nov 1). Scaled
    # down 2026-10-25 from 4x/day: measured capture rates showed the extra
    # runs added almost nothing (0-5 new records per run across 693
    # officials), and 21:00 UTC is the slot the daily brief's 6-hour
    # freshness guard depends on. Source-URL dedup makes re-runs safe.
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: pipeline-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      BRIEF_FROM_ADDR: ${{ secrets.BRIEF_FROM_ADDR }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run daily update
        # Loads every chamber from pipeline/seeds/*.json via load_members().
        # That includes senate.json (US), house.json (US, 437 members),
        # executive.json, tx_senate.json (Texas state senate, 30 districts),
        # and the smaller state seeds. Adding a new chamber is just dropping
        # a new seed file and registering it in pipeline/lib/seeds.py.
        run: python -m pipeline update

      # The three silo refreshes are network-bound against member sites and
      # continue-on-error so one flaky WordPress endpoint can't abort the
      # run. On 2026-08-28 a single transient 403 from one senator's wp-json
      # killed the workflow and skipped RAG embedding and the quality tests.
      - name: Refresh op-ed silos (WP custom post type)
        run: python -m pipeline.scripts.backfill_op_eds
        continue-on-error: true

      - name: Refresh WP extras (newsletters, speeches, blogs, remarks)
        run: python -m pipeline.scripts.backfill_wp_extras
        continue-on-error: true

      - name: Refresh HTML silos (commentary, columns, op-eds, blogs on
          dedicated listing URLs not covered by /press-releases/)
        run: python -m pipeline.scripts.backfill_silos --max-pages 3
        continue-on-error: true

      - name: Update Bluesky social posts
        # Walks the verified-handle directory and pulls anything posted
        # since each senator's most recent already-captured post. Lives in
        # the social_posts table, not press_releases — see /social.
        # continue-on-error so a transient Bluesky outage doesn't take
        # the whole daily run down with it.
        continue-on-error: true
        run: python -m pipeline.scripts.update_bluesky

      - name: Update Senate floor speeches
        # Pulls the daily Congressional Record from govinfo.gov, splits
        # each granule into per-speaker rows, and writes to floor_speeches.
        # No external API key needed (uses unauthenticated content URLs).
        # continue-on-error so a govinfo outage doesn't fail the run.
        continue-on-error: true
        run: python -m pipeline floor-speeches update

      - name: Embed new releases for retrieval
        # "Ask the record" can only answer from rag_passages. Every run adds
        # releases; nothing chunked or embedded them, so the archive grew
        # while retrieval stayed frozen at the last hand-run backfill. That
        # gap reached 623 releases across 188 officials between Jul 30 and
        # Aug 2, 2026 -- the model answers "not in the record" about content
        # that is demonstrably in the record, with nothing to signal it.
        #
        # rag_embed is idempotent and incremental by construction: chunking
        # skips existing (item_id, seq) pairs, embedding only touches rows
        # where embedding IS NULL. Re-running when nothing is new costs
        # nothing. A day of collection is a few hundred chunks, well under a
        # cent at text-embedding-3-small's $0.02/M tokens.
        #
        # Skipped when OPENAI_API_KEY is unset so the workflow still runs
        # before the secret exists. continue-on-error so an OpenAI outage
        # costs retrieval freshness, not the whole pipeline.
        if: env.OPENAI_API_KEY != ''
        continue-on-error: true
        run: python -m pipeline.scripts.rag_embed --all

      - name: Run data-quality tests
        run: python -m pipeline test

      - name: Generate data-health report
        # Runs after collection + tests so the report reflects today's run.
        # if: always() so a failed test step still gets the diagnostic — the
        # day tests fail is the day you most want the health report.
        # docs/ is gitignored so the file lands in the runner workspace
        # only; for now this serves as in-CI diagnostics + a future
        # commit-target if we decide to surface it on the site.
        if: always()
        run: python -m pipeline health-report

      - name: Email on hard failure
        # The nightly digest (daily-digest.yml) is the normal health signal.
        # This step only fires if this run itself failed outright, so a hard
        # failure reaches the inbox the same night instead of waiting for
        # the digest's own schedule.
        if: failure()
        run: python -m pipeline daily-report
