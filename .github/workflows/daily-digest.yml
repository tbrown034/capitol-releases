name: Daily pipeline digest

# End-of-day summary email replacing the noise channel of GH Actions
# failure notifications. Runs after the 21:00 UTC daily collector has
# settled. Sends one email covering captures, silent members, warnings,
# and (loudly) any hard failures.
#
# This workflow re-runs `pipeline test` to regenerate the JSON report
# locally — daily.yml writes the file in its own workspace, which is
# gone by the time this job starts. Test is ~5s against the DB; that
# beats wiring up artifact upload/download for one tiny file.

on:
  schedule:
    # 22:00 UTC = 6pm ET (EDT) / 5pm ET (EST), weekdays, 60 min after the
    # single 21:00 UTC daily collector run. Moved here 2026-10-25 when the
    # collector dropped from 4x/day to one weekday run, so "today's
    # captures" stays accurate. Lands 30 min before the 22:30 UTC brief.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date (ET, YYYY-MM-DD). Blank = today ET."
        required: false
      dry_run:
        description: "Print only, don't send"
        required: false
        type: boolean
        default: false

concurrency:
  group: pipeline-daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      BRIEF_FROM_ADDR: ${{ secrets.BRIEF_FROM_ADDR }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Regenerate data-quality JSON
        # Exit code 1 = HARD assertion fired; we want those IN the
        # digest body, not as a silent CI red. Anything else (2 =
        # crash, 137 = OOM, 130 = SIGINT, 124 = timeout) means the
        # test runner itself broke and the digest will lie. Fail the
        # workflow so the missing-digest email comes through GH.
        run: |
          set +e
          python -m pipeline test
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::pipeline test exited $rc (not a normal HARD failure); refusing to send a misleading digest"
            exit "$rc"
          fi

      - name: Send digest
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m pipeline daily-report $ARGS
