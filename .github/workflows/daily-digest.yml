name: Daily pipeline digest

# End-of-day summary email replacing the noise channel of GH Actions
# failure notifications. Runs after the 21:00 UTC daily collector has
# settled. Sends one email covering captures, silent members, warnings,
# and (loudly) any hard failures.
#
# This workflow re-runs `pipeline test` to regenerate the JSON report
# locally — daily.yml writes the file in its own workspace, which is
# gone by the time this job starts. Test is ~5s against the DB; that
# beats wiring up artifact upload/download for one tiny file.

on:
  schedule:
    # 22:30 UTC = 6:30pm ET, ~60 min after the 21:00 UTC collector.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date (ET, YYYY-MM-DD). Blank = today ET."
        required: false
      dry_run:
        description: "Print only, don't send"
        required: false
        type: boolean
        default: false

concurrency:
  group: pipeline-daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      BRIEF_FROM_ADDR: ${{ secrets.BRIEF_FROM_ADDR }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Regenerate data-quality JSON
        # Don't fail the digest on hard failures — they belong IN the
        # digest, not as a missing email. daily.yml is responsible for
        # going red when the data layer is broken.
        run: python -m pipeline test || true

      - name: Send digest
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m pipeline daily-report $ARGS
