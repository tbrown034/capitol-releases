name: Weekly brief email

# Sends the latest published weekly brief to all active subscribers on
# Thursday night ET, after the brief-weekly cron generates it. Cadence:
# brief-weekly fires 02:00 UTC Friday (9pm ET Thu DST) -> brief-weekly-email
# fires 03:00 UTC Friday (10pm ET Thu DST). One-hour buffer for slow runs
# and SMTP rate-limit headroom.

on:
  schedule:
    - cron: "0 3 * * 5"
  workflow_dispatch:
    inputs:
      date:
        description: "Brief date (Thursday, YYYY-MM-DD). Blank = latest published weekly."
        required: false
      limit:
        description: "Cap recipients (staging only)"
        required: false

concurrency:
  group: pipeline-brief-weekly-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      BRIEF_FROM_NAME: ${{ secrets.BRIEF_FROM_NAME }}
      BRIEF_FROM_ADDR: ${{ secrets.BRIEF_FROM_ADDR }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Send weekly brief
        run: |
          ARGS="--edition weekly"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m pipeline brief-send $ARGS
